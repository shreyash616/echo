name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "ml/inference/music_encoder.onnx"
      - "ml/inference/music_index.faiss"
      - "ml/inference/track_metadata.json"

jobs:
  deploy-backend:
    name: Deploy backend to HF Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload backend to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          token = os.environ.get('HF_TOKEN')
          if not token:
              raise SystemExit('HF_TOKEN not set')
          api = HfApi(token=token)
          api.upload_folder(
              folder_path='backend',
              repo_id='shreyash616/echo-backend',
              repo_type='space',
              ignore_patterns=['**/__pycache__/**', '**/*.pyc', '**/.env*'],
              commit_message='Deploy backend from GitHub Actions'
          )
          "
          echo "Deployed to https://huggingface.co/spaces/shreyash616/echo-backend"

  upload-artifacts:
    name: Upload ML artifacts to HF Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload artifacts to HF Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python ml/upload_artifacts.py
