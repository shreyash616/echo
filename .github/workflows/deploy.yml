name: Deploy

# FIX_PLAN_2.md rule 20a: deploys are explicit dispatches named in a packet entry; a push never deploys.
on:
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy backend to HF Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Next.js web app ships as a static export inside the backend upload; main.py serves backend/web at /
      - name: Build web app into backend/web
        working-directory: web
        run: |
          npm ci
          npm run build
          rm -rf ../backend/web
          cp -r out ../backend/web

      - name: Upload backend to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          token = os.environ.get('HF_TOKEN')
          if not token:
              raise SystemExit('HF_TOKEN not set')
          api = HfApi(token=token)
          api.upload_folder(
              folder_path='backend',
              repo_id='shreyash616/echo-backend',
              repo_type='space',
              ignore_patterns=['**/__pycache__/**', '**/*.pyc', '**/.env*'],
              # The old single-file page, replaced by the web app; upload_folder never removes files on its own
              delete_patterns=['static/index.html'],
              commit_message='Deploy backend from GitHub Actions'
          )
          "
          echo "Deployed to https://huggingface.co/spaces/shreyash616/echo-backend"

  upload-artifacts:
    name: Upload ML artifacts to HF Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload artifacts to HF Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python ml/upload_artifacts.py
