name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite & Overlap Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Golden Audio Feature Tests
        run: pytest tests/test_features_golden.py

      - name: Run No-Gates Integrity Tests
        run: pytest tests/test_no_gates.py

      - name: Run No-Benchmark Leakage Tests
        run: pytest tests/test_no_benchmark_leakage.py

      - name: Run 4-Worlds Overlap Test Against Live Space
        env:
          ECHO_BASE_URL: https://shreyash616-echo-backend.hf.space
        run: pytest tests/test_live_overlap.py

      - name: Run Feel Benchmark on TUNE (report-only)
        run: |
          python tests/feel_benchmark.py --split tune --base-url https://shreyash616-echo-backend.hf.space || true
